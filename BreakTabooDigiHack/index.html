<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BreakTaboo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="achievement-popup-container"></div>

    <div id="game-container">
        <header id="status-bar">
            <div class="status-item">
                Joueur: <span id="avatar-display"></span> <span id="username-display">...</span>
            </div>
            <div class="status-item">
                <span id="level-display">Niveau 1</span>
            </div>
        </header>

        <div id="xp-bar-container">
            <div id="xp-bar"></div>
            <span id="xp-text">0 / 100 XP</span>
        </div>

        <div id="timer-bar-container">
            <div id="timer-bar"></div>
        </div>

        <div id="card">
            <h3 id="level-title">Question...</h3>
            <p id="question-text">Chargement...</p>
        </div>

        <div id="button-container">
            <button class="choice-btn" id="myth-btn">Mythe</button>
            <button class="choice-btn" id="reality-btn">Réalité</button>
        </div>

        <div id="feedback-container">
            <p id="feedback-text"></p>
            <button id="next-btn" class="hidden">Question suivante</button>
        </div>
        
        <div class="nav-links">
            <a href="classement.html" class="nav-link">Classement</a>
            <a href="profil.html" class="nav-link">Mon Profil</a>
            <a href="ressources.html" class="nav-link">Besoin d'aide ?</a>
        </div>
    </div>


    <div id="certificate-modal" class="modal-hidden hidden">
    <div id="certificate">
        <span id="cert-avatar">🔥</span>
        <h2 id="cert-title">Certifiés Briseurs de Tabous</h2>
        <h3 id="cert-name">Les Challengers</h3>
        <p id="cert-stat">A déconstruit 5 Mythes !</p>
        <div id="cert-footer">
            <p>Faites une capture d'écran et partagez !</p>
            <span id="cert-hashtag">#BreakTaboo</span>
        </div>
        <button id="close-cert-btn">Fermer</button>
    </div>
</div>

    <audio id="correct-sound" src="sounds/correct.mp3"></audio>
    <audio id="wrong-sound" src="sounds/wrong.mp3"></audio>
    <audio id="timer-sound" src="sounds/timer-tick.mp3"></audio>

    <script src="script.js"></script>
</body>
</html>
